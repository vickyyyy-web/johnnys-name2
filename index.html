        { id: 97, name: "横山裕", group: "SUPER EIGHT", photo: "image/横山裕.jpg" },
        { id: 98, name: "安田章大", group: "SUPER EIGHT", photo: "image/安田章大.jpg" },
        { id: 99, name: "大仓忠义", group: "SUPER EIGHT", photo: "image/大仓忠义.jpg" }
    ];
    
    // ---------- 核心状态 ----------
    let celebrities = new Map();
    let totalVotes = 0;
    const TARGET_VOTES = 100;
    let leftId = null;
    let rightId = null;
    let processing = false;
    
    // DOM 元素
    const leftCard = document.getElementById('leftCard');
    const rightCard = document.getElementById('rightCard');
    const leftImg = document.getElementById('leftImg');
    const leftName = document.getElementById('leftName');
    const leftGroupSpan = document.getElementById('leftGroup');
    const leftEloSpan = document.getElementById('leftElo');
    const rightImg = document.getElementById('rightImg');
    const rightName = document.getElementById('rightName');
    const rightGroupSpan = document.getElementById('rightGroup');
    const rightEloSpan = document.getElementById('rightElo');
    const voteCounterSpan = document.getElementById('voteCounter');
    const progressFill = document.getElementById('progressFill');
    const viewTop10Btn = document.getElementById('viewTop10Btn');
    const resultPanel = document.getElementById('resultPanel');
    const top10ListDiv = document.getElementById('top10List');
    const resetGameBtn = document.getElementById('resetGameBtn');
    const bothLikeBtn = document.getElementById('bothLikeBtn');
    const bothDislikeBtn = document.getElementById('bothDislikeBtn');
    const favoriteGroupDisplay = document.getElementById('favoriteGroupDisplay');
    
    // ---------- 辅助函数 ----------
    function initMap() {
        celebrities.clear();
        ARTISTS_LIST.forEach(artist => {
            celebrities.set(artist.id, {
                id: artist.id,
                name: artist.name,
                group: artist.group,
                photo: artist.photo,
                elo: 1200,
                wins: 0,
                matches: 0
            });
        });
    }
    
    function getRandomTwoIds() {
        const ids = Array.from(celebrities.keys());
        if (ids.length < 2) return [null, null];
        let idx1 = Math.floor(Math.random() * ids.length);
        let idx2 = Math.floor(Math.random() * ids.length);
        while (idx1 === idx2) {
            idx2 = Math.floor(Math.random() * ids.length);
        }
        return [ids[idx1], ids[idx2]];
    }
    
    function updateCards() {
        if (leftId && celebrities.has(leftId)) {
            const left = celebrities.get(leftId);
            leftImg.src = left.photo;
            leftName.innerText = left.name;
            leftGroupSpan.innerText = left.group;
            leftEloSpan.innerText = `Elo ${Math.round(left.elo)}`;
        }
        if (rightId && celebrities.has(rightId)) {
            const right = celebrities.get(rightId);
            rightImg.src = right.photo;
            rightName.innerText = right.name;
            rightGroupSpan.innerText = right.group;
            rightEloSpan.innerText = `Elo ${Math.round(right.elo)}`;
        }
    }
    
    function refreshMatch() {
        const [newLeft, newRight] = getRandomTwoIds();
        if (newLeft && newRight) {
            leftId = newLeft;
            rightId = newRight;
            updateCards();
        }
    }
    
    function getExpected(rA, rB) {
        return 1 / (1 + Math.pow(10, (rB - rA) / 400));
    }
    
    function updateEloWin(winnerId, loserId) {
        const winner = celebrities.get(winnerId);
        const loser = celebrities.get(loserId);
        const K = 32;
        const expWin = getExpected(winner.elo, loser.elo);
        const expLoss = getExpected(loser.elo, winner.elo);
        winner.elo = winner.elo + K * (1 - expWin);
        loser.elo = loser.elo + K * (0 - expLoss);
        winner.elo = Math.min(2150, Math.max(750, winner.elo));
        loser.elo = Math.min(2150, Math.max(750, loser.elo));
        winner.matches++;
        loser.matches++;
        winner.wins++;
    }
    
    function updateEloBothLike(idA, idB) {
        const a = celebrities.get(idA);
        const b = celebrities.get(idB);
        const K = 32;
        const virtualElo = 1200;
        const expA = getExpected(a.elo, virtualElo);
        const expB = getExpected(b.elo, virtualElo);
        a.elo = a.elo + K * (1 - expA);
        b.elo = b.elo + K * (1 - expB);
        a.elo = Math.min(2150, Math.max(750, a.elo));
        b.elo = Math.min(2150, Math.max(750, b.elo));
        a.matches++;
        b.matches++;
    }
    
    function updateEloBothDislike() {
        // 无变化
    }
    
    function afterVote() {
        totalVotes++;
        voteCounterSpan.innerText = `${totalVotes} 次抉择`;
        const percent = Math.min(100, (totalVotes / TARGET_VOTES) * 100);
        progressFill.style.width = `${percent}%`;
        refreshMatch();
        
        // 如果达到100次，自动结算（若尚未显示结果面板）
        if (totalVotes === TARGET_VOTES && resultPanel.style.display !== 'block') {
            showResult();
        } else if (resultPanel.style.display === 'block') {
            // 如果结果面板已经打开，实时更新排名
            renderTop10AndFavorite();
        }
        
        if (totalVotes === TARGET_VOTES) {
            progressFill.style.background = "#f0a500";
            setTimeout(() => { 
                if(progressFill) progressFill.style.background = "linear-gradient(90deg, #da6e42, #b33f1a)"; 
            }, 1000);
        }
        processing = false;
    }
    
    function handleVote(winnerId, loserId) {
        if (processing) return;
        if (!winnerId || !loserId) return;
        processing = true;
        updateEloWin(winnerId, loserId);
        afterVote();
    }
    
    function handleBothLike() {
        if (processing) return;
        if (!leftId || !rightId) return;
        processing = true;
        updateEloBothLike(leftId, rightId);
        afterVote();
    }
    
    function handleBothDislike() {
        if (processing) return;
        if (!leftId || !rightId) return;
        processing = true;
        updateEloBothDislike();
        afterVote();
    }
    
    function getTop10() {
        const all = Array.from(celebrities.values());
        all.sort((a, b) => b.elo - a.elo);
        return all.slice(0, 10);
    }
    
    function inferFavoriteGroup(top10) {
        if (top10.length === 0) return "暂无数据";
        const groupCount = new Map();
        for (const member of top10) {
            const group = member.group;
            if (!group) continue;
            groupCount.set(group, (groupCount.get(group) || 0) + 1);
        }
        if (groupCount.size === 0) return "未识别";
        let maxCount = 0;
        let candidateGroups = [];
        for (let [group, count] of groupCount.entries()) {
            if (count > maxCount) {
                maxCount = count;
                candidateGroups = [group];
            } else if (count === maxCount) {
                candidateGroups.push(group);
            }
        }
        if (candidateGroups.length === 1) return candidateGroups[0];
        // 平局时选平均Elo最高的团体
        let bestGroup = candidateGroups[0];
        let bestAvgElo = 0;
        for (const group of candidateGroups) {
            const members = top10.filter(m => m.group === group);
            const avgElo = members.reduce((sum, m) => sum + m.elo, 0) / members.length;
            if (avgElo > bestAvgElo) {
                bestAvgElo = avgElo;
                bestGroup = group;
            }
        }
        return bestGroup;
    }
    
    function renderTop10AndFavorite() {
        const top10 = getTop10();
        if (!top10ListDiv) return;
        if (top10.length === 0) {
            top10ListDiv.innerHTML = '<div class="empty-rank">✨ 投票生成你的心动TOP10 ✨</div>';
            favoriteGroupDisplay.innerText = "🏆 推算最爱团体：--";
            return;
        }
        let html = '';
        top10.forEach((star, idx) => {
            const rank = idx + 1;
            let medal = rank === 1 ? '🏆' : (rank === 2 ? '🥈' : (rank === 3 ? '🥉' : rank));
            html += `
                <div class="top10-item">
                    <div class="top10-rank">${medal}</div>
                    <img class="top10-img" src="${star.photo}" alt="${star.name}" onerror="this.src='https://picsum.photos/id/1/80/80'">
                    <div class="top10-name">${star.name}</div>
                    <div class="top10-group">${star.group || ''}</div>
                    <div class="top10-elo">✨ ${Math.round(star.elo)}分</div>
                </div>
            `;
        });
        top10ListDiv.innerHTML = html;
        const favGroup = inferFavoriteGroup(top10);
        favoriteGroupDisplay.innerHTML = `🏆 根据你的TOP10推算，你的最爱团体是：<strong style="font-size:1.3rem;">${favGroup}</strong> 🏆`;
    }
    
    function showResult() {
        renderTop10AndFavorite();
        resultPanel.style.display = 'block';
        resultPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    
    function resetGame() {
        if (processing) return;
        initMap();
        totalVotes = 0;
        voteCounterSpan.innerText = `0 次抉择`;
        progressFill.style.width = `0%`;
        resultPanel.style.display = 'none';
        refreshMatch();
        progressFill.style.background = "linear-gradient(90deg, #da6e42, #b33f1a)";
        processing = false;
    }
    
    function bindEvents() {
        leftCard.addEventListener('click', () => handleVote(leftId, rightId));
        rightCard.addEventListener('click', () => handleVote(rightId, leftId));
        bothLikeBtn.addEventListener('click', () => handleBothLike());
        bothDislikeBtn.addEventListener('click', () => handleBothDislike());
        viewTop10Btn.addEventListener('click', () => {
            if (totalVotes === 0) {
                alert("💖 请先进行至少一次心动抉择，再查看你的TOP10与最爱团 💖");
                return;
            }
            showResult();
        });
        resetGameBtn.addEventListener('click', () => {
            if (confirm('重置会清空所有心动记录，确定重新开始吗？')) {
                resetGame();
            }
        });
    }
    
    function init() {
        initMap();
        bindEvents();
        const [firstLeft, firstRight] = getRandomTwoIds();
        if (firstLeft && firstRight) {
            leftId = firstLeft;
            rightId = firstRight;
            updateCards();
        } else {
            const ids = Array.from(celebrities.keys());
            if (ids.length >= 2) {
                leftId = ids[0];
                rightId = ids[1];
                updateCards();
            }
        }
        resultPanel.style.display = 'none';
        console.log("初始化完成，艺人数量:", celebrities.size);
    }
    
    init();
</script>
